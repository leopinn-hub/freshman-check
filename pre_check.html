<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赴任前確認シート</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --warning: #ef4444;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; background: var(--card); border-radius: 12px; padding: 24px 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); box-sizing: border-box; }
    h1 { font-size: 1.25rem; margin-top: 0; margin-bottom: 16px; text-align: center; }
    .user-info { background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px; }
    .user-info p { margin: 4px 0; }
    
    .info-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
    .info-card h2 { font-size: 0.95rem; margin: 0 0 8px 0; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .info-card p { margin: 0; font-size: 0.9rem; font-weight: bold; white-space: pre-wrap; line-height: 1.5; }

    .checklist-title-box { display: flex; align-items: baseline; justify-content: space-between; margin-top: 24px; margin-bottom: 6px; }
    .section-title { font-size: 0.95rem; font-weight: bold; margin: 0; }
    /* 強調用注意書き */
    .save-notice { color: var(--warning); font-size: 0.85rem; font-weight: bold; }

    .checklist { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
    .check-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
    .check-item:last-child { border-bottom: none; }
    .check-item input[type="checkbox"] { width: 20px; height: 20px; margin-right: 12px; cursor: pointer; accent-color: var(--primary); }
    .check-item label { font-size: 0.9rem; cursor: pointer; flex-grow: 1; }

    button.save-btn { width: 100%; background: #10b981; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2); }
    button.save-btn:disabled { background: #94a3b8; }
    
    #message { margin-top: 16px; padding: 12px; border-radius: 8px; text-align: center; font-size: 0.9rem; display: none; }
    .msg-success { background: #dcfce7; color: #15803d; }
    .msg-error { background: #fee2e2; color: #b91c1c; }

    .link-box { text-align: center; margin-top: 24px; font-size: 0.85rem; }
    .link-box a { color: var(--primary); font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>赴任前確認シート</h1>

  <div class="user-info">
    <p><strong>氏名：</strong><span id="disp-name">読み込み中...</span></p>
    <p><strong>所属拠点：</strong><span id="disp-branch">--</span></p>
  </div>

  <div class="info-card">
    <h2>📅 赴任日時</h2>
    <p><span id="disp-date">--</span> <span id="disp-time">--</span> 集合</p>
  </div>

  <div class="info-card">
    <h2>📍 集合場所</h2>
    <p id="disp-place">--</p>
  </div>

  <div class="info-card">
    <h2>🚆 移動経路・案内</h2>
    <p id="disp-route">--</p>
  </div>

  <div class="checklist-title-box">
    <div class="section-title">🎒 持ち物準備チェック</div>
    <!-- 注意書き（赤字） -->
    <div class="save-notice">※チェックしたら必ず保存！</div>
  </div>

  <form id="checklistForm">
    <div id="checklistItems" class="checklist">
      <div style="text-align: center; color: #64748b; font-size: 0.85rem; padding: 10px;">持ち物リストを読み込んでいます...</div>
    </div>

    <button type="submit" id="saveBtn" class="save-btn">持ち物状況を保存する</button>
  </form>

  <div id="message"></div>

  <div class="link-box">
    <a id="todayLink" href="#">👉 当日の状況報告画面（SOS等）はこちら</a>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDeirkuuCbTTtwecu-V7lBM8urpFvyfVaw",
    authDomain: "freshman-check-2026.firebaseapp.com",
    projectId: "freshman-check-2026",
    storageBucket: "freshman-check-2026.firebasestorage.app",
    messagingSenderId: "127601072250",
    appId: "1:127601072250:web:a6b460431e7bb43bd8c3c3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const studentId = urlParams.get('id');

  const nameEl = document.getElementById('disp-name');
  const branchEl = document.getElementById('disp-branch');
  const dateEl = document.getElementById('disp-date');
  const timeEl = document.getElementById('disp-time');
  const placeEl = document.getElementById('disp-place');
  const routeEl = document.getElementById('disp-route');
  const checklistContainer = document.getElementById('checklistItems');
  const saveBtn = document.getElementById('saveBtn');
  const messageEl = document.getElementById('message');

  let currentMasterList = [];

  window.addEventListener('DOMContentLoaded', () => {
    if (!studentId) {
      showMessage("URLに学生ID（?id=...）が含まれていません。", true);
      saveBtn.disabled = true;
      return;
    }

    document.getElementById('todayLink').href = `index.html?id=${encodeURIComponent(studentId)}`;

    const studentDocRef = doc(db, "students", studentId);
    onSnapshot(studentDocRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        nameEl.textContent = data.name || studentId;
        branchEl.textContent = data.branch || "未指定";
        dateEl.textContent = data.arrival_date || "未指定";
        timeEl.textContent = data.arrival_time || "";
        placeEl.textContent = data.meeting_place || "指定なし";
        routeEl.textContent = data.route_info || "指定なし";

        // 半角カンマ・全角カンマ・改行・読点に対応した確実な分割ロジック
        if (data.master_checklist) {
          const rawStr = String(data.master_checklist);
          currentMasterList = rawStr
            .split(/[,，\n]/)
            .map(s => s.trim())
            .filter(Boolean);
        } else {
          currentMasterList = [];
        }

        let savedStatus = {};
        if (data.checklist_status) {
          try {
            savedStatus = JSON.parse(data.checklist_status);
          } catch(e) {}
        }

        renderChecklist(currentMasterList, savedStatus);
      } else {
        showMessage("該当する学生データがありません。", true);
        saveBtn.disabled = true;
      }
    });
  });

  function renderChecklist(items, savedStatus) {
    if (items.length === 0) {
      checklistContainer.innerHTML = '<div style="text-align: center; color: #64748b; font-size: 0.85rem; padding: 10px;">準備が必要な持ち物は現在ありません。</div>';
      return;
    }

    checklistContainer.innerHTML = '';
    items.forEach((item, index) => {
      const isChecked = savedStatus[item] === true;
      const div = document.createElement('div');
      div.className = 'check-item';
      div.innerHTML = `
        <input type="checkbox" id="chk_${index}" value="${item}" ${isChecked ? 'checked' : ''}>
        <label for="chk_${index}">${item}</label>
      `;
      checklistContainer.appendChild(div);
    });
  }

  document.getElementById('checklistForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const checkInputs = checklistContainer.querySelectorAll('input[type="checkbox"]');
    const statusObj = {};
    let checkedCount = 0;

    checkInputs.forEach(input => {
      statusObj[input.value] = input.checked;
      if (input.checked) checkedCount++;
    });

    const isAllDone = (currentMasterList.length > 0) && (checkedCount === currentMasterList.length);
    const jsonStr = JSON.stringify(statusObj);

    saveBtn.disabled = true;
    saveBtn.textContent = "保存中...";

    try {
      const studentDocRef = doc(db, "students", studentId);
      await setDoc(studentDocRef, {
        checklist_status: jsonStr,
        pre_check_done: isAllDone
      }, { merge: true });

      alert("持ち物状況を保存しました！");
      showMessage("持ち物状況を保存しました！", false);
    } catch (err) {
      console.error(err);
      showMessage("保存エラーが発生しました。", true);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "持ち物状況を保存する";
    }
  });

  function showMessage(msg, isError) {
    messageEl.textContent = msg;
    messageEl.className = isError ? "msg-error" : "msg-success";
    messageEl.style.display = "block";
  }
</script>

</body>
</html>
