<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>直前・当日状況確認</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #10b981;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --danger: #ef4444;
      --warning-bg: #fef3c7;
      --warning-border: #f59e0b;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; background: var(--card); border-radius: 12px; padding: 24px 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); box-sizing: border-box; }
    h1 { font-size: 1.25rem; margin-top: 0; margin-bottom: 8px; text-align: center; color: var(--text); }
    
    .user-info { background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 16px; }
    .user-info p { margin: 4px 0; }
    
    /* 緊急問い合わせ電話窓口の常時表示 */
    .emergency-call-box { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; color: #475569; margin-bottom: 16px; text-align: center; }
    .emergency-call-box strong { color: var(--danger); }

    /* 人事部からの指示表示エリア */
    .admin-msg-box {
      background: var(--warning-bg);
      border: 3px solid var(--warning-border);
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25);
    }
    .admin-msg-box.has-msg {
      border-color: var(--danger);
      background: #fff1f2;
      animation: pulse-border 2s infinite;
    }
    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .admin-msg-box h3 { margin: 0 0 6px 0; font-size: 1rem; color: #991b1b; display: flex; align-items: center; gap: 6px; }
    .admin-msg-box p { margin: 0; font-size: 0.95rem; font-weight: bold; white-space: pre-wrap; line-height: 1.5; color: #7f1d1d; }
    .admin-msg-box p.empty { color: #64748b; font-weight: normal; font-style: italic; }

    .section-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 10px; }
    
    .status-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .status-btn { position: relative; }
    .status-btn input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .status-btn label { display: block; padding: 12px 14px; text-align: left; background: #f8fafc; border: 2px solid var(--border); border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .status-btn input[type="radio"]:checked + label { background: #dbeafe; border-color: var(--primary); color: var(--primary); }
    
    /* ステータス別の強調カラー */
    .status-btn.success input[type="radio"]:checked + label { background: #d1fae5; border-color: var(--success); color: #065f46; }
    .status-btn.warning input[type="radio"]:checked + label { background: #fef3c7; border-color: #f59e0b; color: #b45309; }
    .status-btn.danger input[type="radio"]:checked + label { background: #fee2e2; border-color: var(--danger); color: var(--danger); }

    .note-guide { font-size: 0.8rem; color: #64748b; margin-bottom: 6px; }
    textarea { width: 100%; height: 95px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-size: 0.85rem; resize: vertical; margin-bottom: 8px; }
    
    /* SOS時の注意書き */
    .sos-notice { background: #fff1f2; border: 1px solid #fecdd3; color: #9f1239; font-size: 0.8rem; padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; font-weight: bold; }

    button.submit-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    button.submit-btn:disabled { background: #94a3b8; }
    #message { margin-top: 16px; padding: 12px; border-radius: 8px; text-align: center; font-size: 0.85rem; display: none; line-height: 1.4; }
    .msg-success { background: #dcfce7; color: #15803d; }
    .msg-error { background: #fee2e2; color: #b91c1c; }

    .link-box { text-align: center; margin-top: 24px; font-size: 0.85rem; }
    .link-box a { color: var(--primary); font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>直前・当日状況確認</h1>

  <div class="user-info">
    <p><strong>氏名：</strong><span id="disp-name">読み込み中...</span></p>
    <p><strong>所属拠点：</strong><span id="disp-branch">--</span></p>
  </div>

  <div class="emergency-call-box">
    📞 電波障害や通信エラー時は無理をせず電話：<strong>03-XXXX-XXXX</strong>（本部連絡先）
  </div>

  <!-- 人事部からの指示表示エリア（常時表示） -->
  <div id="adminMsgBox" class="admin-msg-box">
    <h3>🔔【重要】人事担当者からの個別指示</h3>
    <p id="adminMsgText" class="empty">※現在、人事担当者からの個別指示はありません。</p>
  </div>

  <form id="reportForm">
    <div class="section-title">1. 現在のステータスを選択</div>
    <div class="status-group">
      <div class="status-btn">
        <input type="radio" id="s1" name="status" value="体調問題なし・出発OK">
        <label for="s1">体調問題なし・出発OK</label>
      </div>
      <!-- 追加された「集合場所に到着完了」ステータス -->
      <div class="status-btn success">
        <input type="radio" id="s0" name="status" value="集合場所に到着完了">
        <label for="s0">📍 集合場所に到着完了</label>
      </div>
      <div class="status-btn warning">
        <input type="radio" id="s2" name="status" value="体調不良（赴任可能）">
        <label for="s2">体調不良（赴任可能）</label>
      </div>
      <div class="status-btn danger">
        <input type="radio" id="s3" name="status" value="体調不良（移動不可）">
        <label for="s3">⚠️ 体調不良（移動不可）</label>
      </div>
      <div class="status-btn warning">
        <input type="radio" id="s4" name="status" value="遅延あり">
        <label for="s4">遅延あり</label>
      </div>
      <div class="status-btn danger">
        <input type="radio" id="s5" name="status" value="迷子・遅延SOS">
        <label for="s5">🆘 迷子・遅延SOS</label>
      </div>
    </div>

    <div class="section-title">2. 連絡事項・詳細状況</div>
    <div class="note-guide">※遅延時は「乗車路線・何分遅れ」、迷子時は「頭上の看板・周囲の目印」を詳しく入力してください。</div>
    <textarea id="note" placeholder="例：JR中央線が約15分遅延中 / 丸の内地下中央口のセブンイレブン前にいます"></textarea>

    <div class="sos-notice">
      ⚠️ SOS送信後は二次パニック防止のため、絶対にその場から移動せず指示をお待ちください。
    </div>

    <button type="submit" id="submitBtn" class="submit-btn">送信・更新する</button>
  </form>

  <div id="message"></div>

  <div class="link-box">
    <a id="preCheckLink" href="#">👈 赴任前確認シート（集合場所・持ち物）はこちら</a>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, setDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDeirkuuCbTTtwecu-V7lBM8urpFvyfVaw",
    authDomain: "freshman-check-2026.firebaseapp.com",
    projectId: "freshman-check-2026",
    storageBucket: "freshman-check-2026.firebasestorage.app",
    messagingSenderId: "127601072250",
    appId: "1:127601072250:web:a6b460431e7bb43bd8c3c3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const studentId = urlParams.get('id');

  const nameEl = document.getElementById('disp-name');
  const branchEl = document.getElementById('disp-branch');
  const adminMsgBox = document.getElementById('adminMsgBox');
  const adminMsgText = document.getElementById('adminMsgText');
  const formEl = document.getElementById('reportForm');
  const submitBtn = document.getElementById('submitBtn');
  const messageEl = document.getElementById('message');

  window.addEventListener('DOMContentLoaded', () => {
    if (!studentId) {
      showMessage("URLに学生ID（?id=...）が含まれていません。", true);
      submitBtn.disabled = true;
      return;
    }

    document.getElementById('preCheckLink').href = `pre_check.html?id=${encodeURIComponent(studentId)}`;

    const studentDocRef = doc(db, "students", studentId);
    onSnapshot(studentDocRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        nameEl.textContent = data.name || studentId;
        branchEl.textContent = data.branch || "未指定";

        if (data.status) {
          const radio = document.querySelector(`input[name="status"][value="${data.status}"]`);
          if (radio) radio.checked = true;
        }
        if (data.note && document.activeElement !== document.getElementById('note')) {
          document.getElementById('note').value = data.note;
        }

        if (data.admin_message && data.admin_message.trim() !== "") {
          adminMsgText.textContent = data.admin_message;
          adminMsgText.classList.remove('empty');
          adminMsgBox.classList.add('has-msg');
        } else {
          adminMsgText.textContent = "※現在、人事担当者からの個別指示はありません。";
          adminMsgText.classList.add('empty');
          adminMsgBox.classList.remove('has-msg');
        }
      } else {
        showMessage("該当する学生データがありません。", true);
        submitBtn.disabled = true;
      }
    });
  });

  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();

    const selectedStatus = document.querySelector('input[name="status"]:checked');
    if (!selectedStatus) {
      alert("現在のステータスを1つ選択してください。");
      return;
    }

    const nowStr = new Date().toLocaleString("ja-JP");
    const statusVal = selectedStatus.value;
    const noteVal = document.getElementById('note').value;

    submitBtn.disabled = true;
    submitBtn.textContent = "送信中...";

    try {
      const studentDocRef = doc(db, "students", studentId);
      await setDoc(studentDocRef, {
        status: statusVal,
        note: noteVal,
        updated_at: nowStr
      }, { merge: true });

      await addDoc(collection(db, "logs"), {
        student_id: studentId,
        status: statusVal,
        note: noteVal,
        timestamp: nowStr
      });

      alert("ステータスを送信・更新しました！");
      showMessage("ステータスを正常に送信・更新しました！", false);
    } catch (err) {
      console.error(err);
      showMessage("送信エラーが発生しました。電波の良い場所で再試行するか、上記のお問い合わせ電話番号へご連絡ください。", true);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "送信・更新する";
    }
  });

  function showMessage(msg, isError) {
    messageEl.textContent = msg;
    messageEl.className = isError ? "msg-error" : "msg-success";
    messageEl.style.display = "block";
  }
</script>

</body>
</html>
